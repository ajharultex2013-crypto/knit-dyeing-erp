function qcOk(n){const b=D.bt.find(x=>x.no==n);b.q={dia:V('qd'+n),gsm:V('qg'+n),sh:V('qh'+n),rm:V('qr'+n)};b.st='fs';(b.log=b.log||[]).push(['fs',Date.now()]);save();R();toast('Data saved successfully – '+n+' approved')}
P['Quality Queue']=()=>{const l=D.bt.filter(b=>b.st=='qc');return (l.map(b=>`<div class="card"><h3>${b.no} · ${b.order}</h3><small>${b.buyer} · ${b.color} · ${b.qty} kg · Finish: ${b.fdia||'-'} dia / ${b.fgsm||'-'} gsm</small>`+(b.hold?`<p><span class="tag hold">HOLD: ${b.hold}</span> <button onclick="act('${b.no}','res')">Resume</button></p>`:`<div class="grid">${fld('Final Dia','qd'+b.no)}${fld('Final GSM','qg'+b.no)}${fld('Shrinkage %','qh'+b.no)}</div>${fld('Remarks','qr'+b.no)}${fld('Hold reason (সমস্যা হলে)','i'+b.no)}<br><button onclick="qcOk('${b.no}')">Approve – Ready for Delivery</button> <button class="g r" onclick="act('${b.no}','hold')">Hold</button>`)+'</div>').join('')||'<div class="card"><p>Quality-তে কোনো ব্যাচ নেই। Finishing থেকে "Release to QC" দিলে আসবে।</p></div>')};
function delv(n){const b=D.bt.find(x=>x.no==n);if(!V('dv'+n))return toast('Vehicle No দিন');b.veh=V('dv'+n);b.drv=V('dd'+n);b.dd=today();b.dc=nx('dc','DC-',5);b.st='del';(b.log=b.log||[]).push(['del',Date.now()]);save();R();toast('Data saved successfully – Challan No: '+b.dc)}
P['Delivery']=()=>{const l=D.bt.filter(b=>b.st=='fsr'),d=D.bt.filter(b=>b.dc);return `<div class="card"><h3>Ready for Delivery</h3>${l.map(b=>`<div class="card" style="margin:8px 0"><b>${b.no}</b> · ${b.buyer} · ${b.order} · ${b.color} · ${b.qty} kg<div class="grid">${fld('Vehicle No','dv'+b.no)}${fld('Driver / Received by','dd'+b.no)}</div><br><button onclick="delv('${b.no}')">Deliver + Challan</button></div>`).join('')||'<p>কোনো ব্যাচ নেই। Finish Store-এ receive করলে এখানে আসবে।</p>'}</div><div class="card"><h3>Delivered Challans</h3>${tbl(['Challan','Date','Batch','Buyer','Kg',''],d.map(b=>[b.dc,b.dd||'',b.no,b.buyer,b.qty,`<button class="g" onclick="viewDc('${b.no}')">Print</button>`]))}</div>`};
function mkBill(n){const b=D.bt.find(x=>x.no==n),r=+V('rt'+n);if(!(r>0))return toast('Rate/kg দিন');b.rate=r;b.amt=+(r*b.qty).toFixed(2);b.bn=nx('bl','BL-',5);b.pay=[];b.st='billed';(b.log=b.log||[]).push(['billed',Date.now()]);save();R();toast('Data saved successfully – Bill No: '+b.bn)}
function payR(n){const b=D.bt.find(x=>x.no==n),a=+V('pa'+n),due=b.amt-pd(b);if(!(a>0))return toast('Amount দিন');if(a>due+0.001)return toast('Due '+due.toFixed(2)+' এর বেশি নেওয়া যাবে না');b.pay=b.pay||[];b.pay.push({amt:a,mode:V('pm'+n),date:today()});if(b.amt-pd(b)<=0.001){b.st='paid';(b.log=b.log||[]).push(['paid',Date.now()])}save();R();toast('Data saved successfully – Payment received')}
function viewBill(n){const b=D.bt.find(x=>x.no==n);sheet('Bill / Invoice',b.bn,`<p>Buyer: <b>${b.buyer}</b> · Order: ${b.order} · Challan: ${b.dc||'-'}</p>`+tbl(['Batch','Color','Process','Qty kg','Rate','Amount'],[[b.no,b.color,b.proc||'-',b.qty,b.rate,b.amt]])+`<p>Paid: <b>${pd(b).toFixed(2)}</b> · Due: <b>${(b.amt-pd(b)).toFixed(2)}</b></p>`+tbl(['Date','Mode','Amount'],(b.pay||[]).map(x=>[x.date,x.mode,x.amt])),['Prepared By (Accounts)','Checked By','Authorised Signatory'])}
P['Billing']=()=>{const nb=D.bt.filter(b=>b.st=='del'),bl=D.bt.filter(b=>b.amt),by={};bl.forEach(b=>{const o=by[b.buyer]=by[b.buyer]||{a:0,p:0};o.a+=b.amt;o.p+=pd(b)});return `<div class="card"><h3>Bill তৈরি করুন (Delivered)</h3>${nb.map(b=>`<div class="card" style="margin:8px 0"><b>${b.no}</b> · ${b.buyer} · ${b.order} · Delivered ${b.dq||b.qty} kg · ${b.proc||''}<br><small>Chemical cost: Tk ${chCost(b).toFixed(0)} (${(chCost(b)/b.qty).toFixed(2)} / kg)</small><div class="grid">${fld('Rate / kg','rt'+b.no,'','number')}</div><br><button onclick="mkBill('${b.no}')">Create Bill</button></div>`).join('')||'<p>Bill-এর অপেক্ষায় কোনো ডেলিভারি নেই।</p>'}</div><div class="card"><h3>Payment (Cash / LC / Bank)</h3>${bl.filter(b=>b.st=='billed').map(b=>`<div class="card" style="margin:8px 0"><b>${b.bn}</b> · ${b.buyer} · ${b.no}<br>Amount ${b.amt} · Paid ${pd(b).toFixed(2)} · <b>Due ${(b.amt-pd(b)).toFixed(2)}</b><div class="grid">${fld('Amount','pa'+b.no,'','number')}<label>Mode<select id="pm${b.no}"><option>Cash</option><option>LC</option><option>Bank</option></select></label></div><br><button onclick="payR('${b.no}')">Receive Payment</button> <button class="g" onclick="viewBill('${b.no}')">Bill</button></div>`).join('')||'<p>কোনো due বিল নেই।</p>'}</div><div class="card"><h3>Buyer-wise Accounts</h3>${tbl(['Buyer','Billed','Paid','Due'],Object.keys(by).map(k=>[k,by[k].a.toFixed(2),by[k].p.toFixed(2),(by[k].a-by[k].p).toFixed(2)]))}</div><div class="card"><h3>All Bills</h3>${tbl(['Bill','Buyer','Batch','Amount','Paid','Status',''],bl.map(b=>[b.bn||'',b.buyer,b.no,b.amt,pd(b).toFixed(2),ST[b.st],b.bn?`<button class="g" onclick="viewBill('${b.no}')">Print</button>`:'']))}</div>`};
P['Finishing Queue']=()=>{const fl=D.bt.filter(b=>b.st=='fin'),pre=D.bt.filter(b=>['floor','dyeing'].includes(b.st));
const cards=fl.map(b=>{const ps=(b.proc||'').split(', ').filter(Boolean),fp=b.fp||{};
const body=b.hold?`<p><span class="tag hold">HOLD: ${b.hold}</span> <button onclick="act('${b.no}','res')">Resume</button></p>`:`${ps.map((p,i)=>{const o=fp[p]||{};return `<div class="card" style="margin:8px 0"><label style="font-size:14px;color:var(--t)"><input type="checkbox" id="fk${b.no}_${i}" style="width:auto" ${o.done?'checked':''}> <b>${p}</b> ${o.done?'<span class="tag">Done</span>':''}</label><div class="grid">${FP(p).map(([k,lb])=>fld(lb,`fx${b.no}_${i}_${k}`,o[k]||'')).join('')}</div></div>`}).join('')||'<p>কোনো process নির্দিষ্ট নেই</p>'}<div class="grid">${fld('Finish Dia','fd'+b.no,b.fdia||'')}${fld('Finish GSM','fg'+b.no,b.fgsm||'')}</div>${fld('Hold reason (সমস্যা হলে)','i'+b.no)}<br><button class="g" onclick="finSave('${b.no}')">Save Progress</button> <button onclick="finRel('${b.no}')">Release to QC</button> <button class="g r" onclick="fcol('${b.no}');act('${b.no}','hold')">Hold</button> <button class="g" onclick="viewBt('${b.no}')">Batch Card</button>`;
return `<div class="card"><h3>${b.no} · ${b.order}</h3><small>${b.buyer} · ${b.color} · ${b.qty} kg · ${b.mc}</small>${body}</div>`}).join('');
return (cards||'<div class="card"><h3>Finishing</h3><p>এখন Finishing-এ কোনো ব্যাচ নেই। Dyeing Production পেজে ব্যাচে "Shade OK → Release" দিলে এখানে আসবে।</p></div>')+`<div class="card"><h3>Dyeing-এ আছে (আসছে)</h3>${tbl(['Batch','Order','Color','Kg','Stage'],pre.map(b=>[b.no,b.order,b.color,b.qty,ST[b.st]]))}</div>`};

const stockMap=()=>{const m={},add=n=>{const k=ck(n);return m[k]=m[k]||{n,i:0,o:0,v:0,rq:0,cat:'—',unit:'kg',min:0,loc:'',code:''}};D.cm.forEach(c=>Object.assign(add(c.name),{n:c.name,cat:c.cat,unit:c.unit,min:+c.min||0,loc:c.loc||'',code:c.code}));D.cv.forEach(r=>{const x=add(r.name);x.i+=r.qty;if(r.rate>0){x.v+=r.qty*r.rate;x.rq+=r.qty}});D.ci.forEach(c=>c.items.forEach(i=>{add(i.n).o+=i.qty}));D.cadj.forEach(a=>{const x=add(a.name);if(a.qty>0)x.i+=a.qty;else x.o-=a.qty});return m};
const bal=n=>{const m=stockMap()[ck(n)];return m?m.i-m.o:0};
const avgRate=x=>x.rq>0?x.v/x.rq:0;
const stLow=x=>(x.i>0&&x.i-x.o<=0)||(x.min>0&&x.i-x.o<=x.min);
const inMaster=n=>D.cm.some(c=>ck(c.name)==ck(n));

function adjSave(){const n=V('adn').trim(),q=+V('adq'),t=V('adt');if(!inMaster(n))return toast('Master-এর item সিলেক্ট করুন');if(!(q>0))return toast('Qty দিন');if(!V('adr'))return toast('কারণ / রেফারেন্স লিখুন');if(ADJ[t]<0&&q>bal(n)+0.0001)return toast('Stock এর চেয়ে বেশি কমানো যাবে না (balance '+bal(n).toFixed(3)+')');const m=D.cm.find(c=>ck(c.name)==ck(n));D.cadj.push({no:nx('ca','AD-',5),date:V('add'),name:m.name,type:t,qty:ADJ[t]*q,reason:V('adr'),by:me.n});save();R();toast('Data saved successfully – Stock adjusted')}

P['Stock Adjustment']=()=>`<div class="card"><h3>Stock Adjustment / Return</h3><datalist id="adl">${D.cm.map(c=>`<option value="${c.name}">`).join('')}</datalist><div class="grid">${fld('Date','add',today(),'date')}<label>Chemical<input id="adn" list="adl"></label><label>Type<select id="adt">${Object.keys(ADJ).map(k=>`<option value="${k}">${k} (${ADJ[k]>0?'+':'−'})</option>`).join('')}</select></label>${fld('Quantity','adq','','number')}${fld('Reason / Reference (batch, count sheet)','adr')}</div><br><button onclick="adjSave()">Save Adjustment</button></div><div class="card"><h3>Adjustment History</h3>${tbl(['No','Date','Chemical','Type','Qty','Reason','By'],D.cadj.slice().reverse().map(a=>[a.no,a.date,a.name,a.type,a.qty,a.reason,a.by||'']))}</div>`;
P['Chemical Stock']=()=>{const q=ck(window.SK),cat=window.SC||'',m=Object.values(stockMap()),rows=m.filter(x=>(!q||ck(x.n+x.cat+x.code).includes(q))&&(!cat||x.cat==cat)),val=m.reduce((a,x)=>a+(x.i-x.o)*avgRate(x),0),low=m.filter(stLow).length,sel=window.SL?stockMap()[ck(window.SL)]:null,stt=x=>{const b=x.i-x.o;return x.i>0&&b<=0?'<span class="tag hold">OUT</span>':x.min>0&&b<=x.min?'<span class="tag hold">LOW</span>':'<span class="tag">OK</span>'};return `<div class="grid"><div class="card" style="margin:0">Items in stock<br><b style="font-size:20px">${m.filter(x=>x.i-x.o>0).length}</b></div><div class="card" style="margin:0">Stock value (Tk)<br><b style="font-size:20px">${val.toFixed(0)}</b></div><div class="card" style="margin:0">Low / Out items<br><b style="font-size:20px">${low}</b></div></div><div class="card"><h3>Chemical Stock</h3>${fld('Search','sk',window.SK||'')}<label>Category<select onchange="window.SC=this.value;R()"><option value="">All categories</option>${CATS.map(c=>`<option ${cat==c?'selected':''}>${c}</option>`).join('')}</select></label><button class="g" onclick="window.SK=V('sk');R()">Search</button> <button class="g" onclick="printSk()">Print Stock Report</button>${tbl(['Code','Chemical','Category','Unit','In','Out','Balance','Reorder','Avg Rate','Value','Status',''],rows.map(x=>{const b=x.i-x.o;return [x.code,x.n,x.cat,x.unit,x.i.toFixed(3),x.o.toFixed(3),`<b>${b.toFixed(3)}</b>`,x.min||'',avgRate(x).toFixed(2),(b*avgRate(x)).toFixed(0),stt(x),`<button class="g" onclick="window.SL='${x.n.replace(/'/g,"")}';R()">Ledger</button>`]}))}</div>${sel?`<div class="card"><h3>Ledger – ${sel.n}</h3><button class="g" onclick="printLd('${sel.n.replace(/'/g,"")}')">Print Ledger</button> <button class="g" onclick="window.SL='';R()">Close</button>${tbl(['Date','Type','Ref','In','Out','Balance','Note'],ledger(sel.n))}</div>`:''}`};


const ck=n=>String(n||'').trim().toLowerCase();
const chOk=b=>{const q=D.cq.find(x=>x.no==b.cq);return !!q&&q.rows.every(r=>r.iss)};
function mkCq(n){const b=D.bt.find(x=>x.no==n);if(!b.rcp)return toast('আগে recipe সেভ করুন');if(b.cq)return toast('Requisition আগেই দেওয়া হয়েছে: '+b.cq);const q={no:nx('cq','CQ-',5),date:today(),batch:n,rows:b.rcp.rows.map(r=>({s:r.s||'Dyeing',n:r.n,req:+rK(r,b,b.rcp.lr).toFixed(3)}))};D.cq.push(q);b.cq=q.no;save();R();toast('Data saved successfully – Chemical Requisition: '+q.no)}
function viewCq(no){const q=D.cq.find(x=>x.no==no),b=D.bt.find(x=>x.no==q.batch);sheet('Chemical Requisition',no,kv([['Batch No',b.no,'Date',q.date],['Buyer',b.buyer,'Order',b.order],['Color',b.color,'Machine',b.mc],['Batch Qty (kg)',b.qty,'Liquor Ratio','1 : '+lrN(b.rcp.lr)]])+tbl(['SL','Stage','Chemical / Dye','Required (kg)','Issued (kg)','Issue No'],q.rows.map((r,i)=>[i+1,r.s,r.n,r.req.toFixed(3),r.iss?r.iq.toFixed(3):'',r.ino||''])),['Requested By (Dyeing)','Checked By','Approved By'])}
function viewCi(no){const c=D.ci.find(x=>x.no==no),b=D.bt.find(x=>x.no==c.batch);let t=0;const rows=c.items.map((i,k)=>{t+=i.qty;return [k+1,i.s,i.n,i.qty.toFixed(3),'']});sheet('Chemical Delivery Challan',no,kv([['Batch No',b.no,'Issue Date',c.date],['Buyer',b.buyer,'Order',b.order],['Color',b.color,'Machine',b.mc],['Requisition No',c.cq,'Batch Qty (kg)',b.qty]])+tbl(['SL','Stage','Chemical / Dye','Issued Qty (kg)','Remarks'],rows)+`<p style="text-align:right"><b>Total Issued: ${t.toFixed(3)} kg</b></p>`,['Issued By (Chemical Store)','Received By (Dyeing)','Approved By'])}
function ciSave(){const q=D.cq.find(x=>x.no==window.CI);if(!q)return;const run={},items=[];for(let k=0;k<q.rows.length;k++){const r=q.rows[k];if(r.iss)continue;const e=$('cc'+k);if(!e||!e.checked)continue;const a=+V('cqty'+k);if(!(a>0))return toast('Issue qty দিন: '+r.n);const key=ck(r.n);run[key]=(run[key]||0)+a;if(run[key]>bal(r.n)+0.0001)return toast('Stock নেই: '+r.n+' (available '+bal(r.n).toFixed(3)+' kg)');items.push({k,n:r.n,s:r.s,qty:a})}if(!items.length)return toast('কিছু সিলেক্ট করুন');const no=nx('ci','CI-',5);D.ci.push({no,cq:q.no,batch:q.batch,date:today(),items:items.map(({n,s,qty})=>({n,s,qty}))});items.forEach(i=>{q.rows[i.k].iss=1;q.rows[i.k].iq=i.qty;q.rows[i.k].ino=no});window.CI=q.rows.every(r=>r.iss)?null:q.no;save();R();toast('Data saved successfully – Issue No: '+no)}
P['Chemical Requisition']=()=>{const w=D.bt.filter(b=>b.st=='floor'&&b.rcp&&!b.cq);return `<div class="card"><h3>Recipe সম্পন্ন – Requisition বাকি</h3>${tbl(['Batch','Order','Color','Kg','Items',''],w.map(b=>[b.no,b.order,b.color,b.qty,b.rcp.rows.length,`<button onclick="mkCq('${b.no}')">Make Requisition</button>`]))}</div><div class="card"><h3>Chemical Requisitions</h3>${tbl(['Req No','Date','Batch','Order','Status',''],D.cq.slice().reverse().map(q=>{const b=D.bt.find(x=>x.no==q.batch)||{},d=q.rows.filter(r=>r.iss).length;return [q.no,q.date,q.batch,b.order||'',d==q.rows.length?'Issued':d+'/'+q.rows.length+' issued',`<button class="g" onclick="viewCq('${q.no}')">Print</button>`]}))}</div>`};
P['Chemical Issue']=()=>{const q=D.cq.find(x=>x.no==window.CI),pend=D.cq.filter(x=>x.rows.some(r=>!r.iss));const form=q?`<div class="card"><h3>Issue against ${q.no} · Batch ${q.batch}</h3>${q.rows.map((r,k)=>r.iss?'':`<div class="grid"><label style="font-size:13px;color:var(--t)"><input type="checkbox" id="cc${k}" style="width:auto" checked> ${r.n} <small>(${r.s})</small><br><small>Required ${r.req.toFixed(3)} kg · Stock ${bal(r.n).toFixed(3)} kg</small></label>${fld('Issue qty (kg)','cqty'+k,r.req.toFixed(3),'number')}</div>`).join('')}<br><button onclick="ciSave()">Issue</button> <button class="g" onclick="window.CI=null;R()">Cancel</button></div>`:'';return form+`<div class="card"><h3>Pending Requisitions</h3>${tbl(['Req','Batch','Order','Pending rows',''],pend.map(x=>{const b=D.bt.find(y=>y.no==x.batch)||{};return [x.no,x.batch,b.order||'',x.rows.filter(r=>!r.iss).length,`<button onclick="window.CI='${x.no}';R()">Open</button>`]}))}</div><div class="card"><h3>Issued Challans</h3>${tbl(['Issue','Req','Batch','Date',''],D.ci.slice().reverse().map(c=>[c.no,c.cq,c.batch,c.date,`<button class="g" onclick="viewCi('${c.no}')">Print</button>`]))}</div>`};



const FMC=['Stenter-01','Stenter-02','Compactor-01','Compactor-02','Dryer-01','Squeezer-01','Slitter-01','Brush-01','Peach-01','Shearing-01'];
const lgT=(b,st)=>{const l=(b.log||[]).find(y=>y[0]==st);return l?l[1]:0};
const tmS=t=>t?new Date(t).toLocaleString('en-GB'):'';
const selF=(l,i,o,v)=>`<label>${l}<select id="${i}"><option value="">—</option>${o.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select></label>`;
function fcol(n){const b=D.bt.find(x=>x.no==n),ps=(b.proc||'').split(', ').filter(Boolean);b.fp=b.fp||{};b.fd=b.fd||{};ps.forEach((p,i)=>{const o=b.fp[p]||{};FP(p).forEach(([k])=>o[k]=V(`fx${n}_${i}_${k}`));const d=!!($(`fk${n}_${i}`)||{}).checked;if(d&&!o.done)o.at=Date.now();o.done=d;b.fp[p]=o;b.fd[p]=d});b.fdia=V('fd'+n);b.fgsm=V('fg'+n);b.fm=V('fm'+n);b.fo=V('fo'+n);b.fsh=V('fsh'+n);b.fr=+V('fr'+n)||0;b.fa=+V('fa'+n)||0}
function finRel(n){const b=D.bt.find(x=>x.no==n);fcol(n);const ps=(b.proc||'').split(', ').filter(Boolean);const bad=ps.some(x=>!b.fd[x])?'সব finishing process টিক দিন':!b.fm?'Finishing machine দিন':!(b.fa>0)?'Actual Finish Qty (kg) দিন':'';if(bad){save();R();return toast(bad)}b.st='qc';(b.log=b.log||[]).push(['qc',Date.now()]);save();R();toast('Data saved successfully – '+n+' Quality-তে গেছে')}
P['Finishing Queue']=()=>{const fl=D.bt.filter(b=>b.st=='fin'),pre=D.bt.filter(b=>['floor','dyeing'].includes(b.st));
const cards=fl.map(b=>{const ps=(b.proc||'').split(', ').filter(Boolean),fp=b.fp||{},plan=(b.qty/(1+(b.pl||0)/100)).toFixed(1);
const body=b.hold?`<p><span class="tag hold">HOLD: ${b.hold}</span> <button onclick="act('${b.no}','res')">Resume</button></p>`:`<datalist id="fml">${FMC.map(x=>`<option value="${x}">`).join('')}</datalist><div class="grid"><label>Finishing Machine<input id="fm${b.no}" list="fml" value="${q_(b.fm||'')}"></label>${fld('Operator','fo'+b.no,b.fo||'')}${selF('Shift','fsh'+b.no,['A','B','C'],b.fsh)}</div>${ps.map((p,i)=>{const o=fp[p]||{};return `<div class="card" style="margin:8px 0"><label style="font-size:14px;color:var(--t)"><input type="checkbox" id="fk${b.no}_${i}" style="width:auto" ${o.done?'checked':''}> <b>${p}</b> ${o.done?'<span class="tag">Done</span>':''}</label><div class="grid">${FP(p).map(([k,lb])=>fld(lb,`fx${b.no}_${i}_${k}`,o[k]||'')).join('')}</div></div>`}).join('')||'<p>কোনো process নির্দিষ্ট নেই</p>'}<div class="grid">${fld('Actual Finish Qty (kg)','fa'+b.no,b.fa||'','number')}${fld('Rolls','fr'+b.no,b.fr||'','number')}${fld('Finish Dia','fd'+b.no,b.fdia||'')}${fld('Finish GSM','fg'+b.no,b.fgsm||'')}</div><small>Planned finish qty (booking loss ${b.pl||0}%): ${plan} kg</small>${fld('Hold reason (সমস্যা হলে)','i'+b.no)}<br><button class="g" onclick="finSave('${b.no}')">Save Progress</button> <button onclick="finRel('${b.no}')">Release to QC</button> <button class="g r" onclick="fcol('${b.no}');act('${b.no}','hold')">Hold</button> <button class="g" onclick="viewBt('${b.no}')">Batch Card</button>`;
return `<div class="card"><h3>${b.no} · ${b.order}</h3><small>${b.buyer} · ${b.color} · ${b.item} · Dyed ${b.qty} kg · Finishing শুরু: ${tmS(lgT(b,'fin'))}</small>${body}</div>`}).join('');
return (cards||'<div class="card"><h3>Finishing</h3><p>এখন Finishing-এ কোনো ব্যাচ নেই। Dyeing Production পেজে ব্যাচে "Shade OK → Release" দিলে এখানে আসবে।</p></div>')+`<div class="card"><h3>Dyeing-এ আছে (আসছে)</h3>${tbl(['Batch','Order','Color','Kg','Stage'],pre.map(b=>[b.no,b.order,b.color,b.qty,ST[b.st]]))}</div>`};
function frRows(){const q=ck(window.FQ);return D.bt.filter(b=>(b.fa||b.st=='fin')&&(!q||ck(b.no+b.order+b.color+b.buyer+(b.fm||'')+(b.fo||'')).includes(q)))}
function frTbl(rows){return tbl(['Batch','Order','Color','Item','Dyed kg','Finish kg','Actual loss','Booked loss','Machine','Operator','Shift','Rolls','Start','End','Hrs'],rows.map(b=>{const a=lgT(b,'fin'),z=lgT(b,'qc');return [b.no,b.order,b.color,b.item,b.qty,b.fa||'',b.fa?(((b.qty/b.fa)-1)*100).toFixed(1)+'%':'',(b.pl||0)+'%',b.fm||'',b.fo||'',b.fsh||'',b.fr||'',tmS(a),tmS(z),a&&z?((z-a)/3600000).toFixed(1):'']}))}
